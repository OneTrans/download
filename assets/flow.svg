<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 210" width="1120" height="210" role="img" aria-labelledby="title desc">
  <title id="title">How OneTrans works</title>
  <desc id="desc">You speak your language. OneTrans recognizes, translates and speaks it on your computer. A virtual microphone carries the result into Zoom, Meet, Teams or Discord, which hear the listener's language.</desc>
  <rect width="1120" height="210" rx="28" fill="#faf9f6"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="44" y="46" font-size="11" font-weight="600" letter-spacing="2.2" fill="#8a857b">HOW IT WORKS</text>

    <g fill="#191919">
      <text x="44" y="98" font-size="20" font-weight="600">You speak</text>
      <text x="320" y="98" font-size="20" font-weight="600">OneTrans</text>
      <text x="606" y="98" font-size="20" font-weight="600">Virtual microphone</text>
      <text x="892" y="98" font-size="20" font-weight="600">They hear</text>
    </g>
    <g fill="#6f6b63" font-size="13">
      <text x="44" y="123">your language</text>
      <text x="320" y="123">recognizes · translates · speaks</text>
      <text x="606" y="123">any app can pick it up</text>
      <text x="892" y="123">their language</text>
    </g>

    <g stroke="#b8b2a6" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M268 108h22M284 102l6 6-6 6"/>
      <path d="M554 108h22M570 102l6 6-6 6"/>
      <path d="M840 108h22M856 102l6 6-6 6"/>
    </g>

    <text x="44" y="174" font-size="12" fill="#8a857b">Speech recognition, translation and speech synthesis run entirely on your computer.</text>
    <text x="1076" y="174" font-size="12" fill="#8a857b" text-anchor="end">47 languages · works offline after setup</text>
  </g>
</svg>
